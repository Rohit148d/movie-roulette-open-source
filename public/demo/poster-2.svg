<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" role="img" aria-label="Demo poster, neon city">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07121c"/><stop offset=".6" stop-color="#0a0b14"/><stop offset="1" stop-color="#050507"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55d7e8"/><stop offset=".5" stop-color="#2a7ff0"/><stop offset="1" stop-color="#d24bd2"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#fa4d8f" stop-opacity=".8"/><stop offset="1" stop-color="#fa4d8f" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <g filter="url(#glow)" opacity=".55">
    <rect x="52" y="170" width="16" height="330" fill="#2a7ff0"/>
    <rect x="380" y="120" width="10" height="420" fill="#d24bd2"/>
    <rect x="250" y="90" width="8" height="300" fill="#55d7e8"/>
  </g>
  <rect x="40" y="520" width="420" height="2" fill="url(#neon)" opacity=".7"/>
  <path d="M60 520 L120 330 L170 520 M150 520 L210 250 L265 520 M250 520 L330 300 L400 520" fill="none" stroke="url(#neon)" stroke-opacity=".55" stroke-width="1.4"/>
  <rect x="0" y="610" width="500" height="140" fill="url(#pink)" opacity=".35"/>
  <g fill="#e7b96f" font-family="Arial, sans-serif">
    <text x="40" y="662" fill="#dff8ff" font-family="Georgia, serif" font-size="16" letter-spacing="4">A MOVIE ROULETTE DEMO</text>
    <text x="40" y="692" fill="#6f8b98" font-size="9" letter-spacing="3">NEON HARVEST · REEL 02</text>
  </g>
</svg>
